<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- 2026-10-13: 스플래시 글자가 작게 떴다가 앱이 뜬 뒤에야 커지던 버그 — Flutter가 나중에 넣는 viewport 설정을 처음부터 넣음 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="오늘 날씨·장바구니 물가·행사·금리·정부 지원까지, 하루에 필요한 생활 정보를 공공데이터로 한 번에.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="데일리컷">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- 2026-10-15: 글꼴은 앱 엔진이 뜬 뒤(약 3초)에야 받기 시작해서 큰 세리프 글꼴(약 0.6MB)이 첫 화면을 붙잡았음 →
       번들(main.dart.js)과 동시에 미리 받음. 파일 이름의 -rN을 올리면 여기도 같이 고칠 것. -->
  <link rel="preload" href="assets/assets/fonts/NotoSerifKR-700-r2.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansKR-400-r2.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansKR-700-r2.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSerifKR-900-r2.ttf" as="font" type="font/ttf" crossorigin>
  <title>데일리컷</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 2026-10-12: 앱 엔진(약 3MB)이 뜨기 전 빈 흰 화면을 없애려는 스플래시. 첫 화면 데이터가 준비되면 지움(10-13: 첫 프레임이 아니라 데이터 기준으로). */
    html, body { margin: 0; background: #fff; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #fff; color: #191919; z-index: 10; transition: opacity .25s ease; font-family: "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    #splash .sub { font-size: 13px; color: #8b8b8b; }
    #splash .bar { width: 120px; height: 2px; background: #ebebeb; overflow: hidden; border-radius: 2px; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #191919; animation: slide 1.1s ease-in-out infinite; }
    #splash .wx { display: none; flex-direction: column; align-items: center; gap: 4px; max-width: 300px; text-align: center; }
    #splash .wx b { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    #splash .wx span { font-size: 13px; color: #8b8b8b; line-height: 1.5; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="불러오는 중">
    <div class="mark">데일리컷</div>
    <div class="bar"><i></i></div>
    <div class="sub">오늘 필요한 정보를 모으는 중</div>
    <div class="wx" id="splash-wx"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    /* 2026-10-15: 앱이 뜨는 데 약 3~5초 걸려서(첫 방문), 그동안 빈 로고만 보이지 않게 날씨 한 줄을 먼저 받아 스플래시에 보임.
       배포본(/dailycut/)에서만 부르고, 실패·지연(8초)은 조용히 무시함. 앱이 뜨면 스플래시째로 걷힘. */
    (function () {
      try {
        if (location.pathname.indexOf('/dailycut/') !== 0 || !window.fetch) return;
        var get = function (k) {
          try { var v = localStorage.getItem('flutter.' + k); if (!v) return null; try { return JSON.parse(v); } catch (e) { return v; } } catch (e) { return null; }
        };
        var sido = get('region_code'), sgg = get('region_sgg');
        var q = '?sido=' + encodeURIComponent(sido || '11') + (sgg ? '&sgg=' + encodeURIComponent(sgg) : '');
        var ctl = window.AbortController ? new AbortController() : null;
        setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
        fetch('/dailycut-api/weather' + q, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.json(); }).then(function (w) {
          var box = document.getElementById('splash-wx'), sub = document.querySelector('#splash .sub');
          var t = w && w.today;
          if (!box || !t || (w.live_keys || []).indexOf('today') < 0) return;
          box.innerHTML = '';
          var b = document.createElement('b'); b.textContent = t.temp + '° ' + t.condition;
          var s1 = document.createElement('span'); s1.textContent = '낮 최고 ' + t.high + '° · 최저 ' + t.low + '°';
          box.appendChild(b); box.appendChild(s1);
          if (w.outfit) { var s2 = document.createElement('span'); s2.textContent = w.outfit; box.appendChild(s2); }
          box.style.display = 'flex';
          if (sub) sub.style.display = 'none';
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script>
    /* 스플래시는 앱이 첫 화면 데이터를 받은 뒤 스스로 걷음(lib/splash_web.dart). 인터넷이 아주 느리거나 앱이 못 떠도
       빈 화면에 갇히지 않게 20초 뒤엔 어쨌든 걷음. */
    setTimeout(function () {
      var el = document.getElementById('splash');
      if (el) { el.classList.add('done'); setTimeout(function () { el.remove(); }, 400); }
    }, 20000);
  </script>
  <!-- 2026-10-14: 앱 화면은 캔버스라 검색·심사 로봇이 글을 못 읽음 → 같은 내용을 글로도 둠(화면에선 보이지 않고 스크린리더·로봇만 읽음) -->
  <div style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">
    <h1>데일리컷 — 공공데이터로 매일 모으는 생활 정보</h1>
    <p>내 지역의 오늘 날씨·미세먼지, 채소·과일·축산물 소매가격과 제철, 지역 행사·전시·나들이, 정부 지원·청약·공공임대·서민 대출 정보를 한곳에서 볼 수 있습니다. 회원가입이 필요 없습니다.</p>
    <a href="about.html">서비스 소개</a> <a href="privacy.html">개인정보처리방침</a>
  </div>
  <noscript>이 서비스는 자바스크립트가 필요해요. <a href="about.html">서비스 소개</a> · <a href="privacy.html">개인정보처리방침</a></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
