<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ad</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
</head>
<body>
<!-- 카카오 애드핏 배너를 담는 작은 페이지. 앱이 iframe으로 불러오며, 광고 단위 ID(DAN-…)와 크기는 주소의 쿼리로 받음.
     같은 도메인에서 불러와야 애드핏이 등록한 사이트 주소로 인식함. ID 형식이 아니면 아무것도 그리지 않음. -->
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var unit = p.get('unit') || '';
  var w = String(parseInt(p.get('w') || '320', 10) || 320);
  var h = String(parseInt(p.get('h') || '100', 10) || 100);
  if (!/^DAN-[A-Za-z0-9]{6,40}$/.test(unit)) return;
  var ins = document.createElement('ins');
  ins.className = 'kakao_ad_area';
  ins.style.display = 'none';
  ins.setAttribute('data-ad-unit', unit);
  ins.setAttribute('data-ad-width', w);
  ins.setAttribute('data-ad-height', h);
  document.body.appendChild(ins);
  var s = document.createElement('script');
  s.async = true;
  s.src = '//t1.daumcdn.net/kas/static/ba.min.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
